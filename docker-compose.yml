  mongo_db:
    image: mongo:latest
    container_name: parcial_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  
  redis_cache:
    image: redis:alpine
    container_name: parcial_redis
    ports:
      - "6379:6379"



  
  backend-fastapi:
    build: ./backend-fastApi
    container_name: parcial_backend-fastapi
    ports:
      - "8000:8000"
    env_file:
      - ./backend-fastApi/.env_docker
    volumes:
      - ./backend-fastApi:/app
    depends_on:
      - mongo_db




  backend-spring:
    build: 
      context: ./backend-sprint
      dockerfile: Dockerfile
    container_name: uagrm_backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend-sprint/.env_docker
    volumes:
      - ./backend-sprint:/app     
      - ~/.m2:/root/.m2           
    command: ./mvnw spring-boot:run
    depends_on:
      - mongo_db




  frontend:
    build:
      context: ./frontend-angular
      dockerfile: Dockerfile
    container_name: uagrm_frontend
    ports:
      - "4200:4200"
    env_file:
      - ./frontend-angular/.env
    volumes:
      - ./frontend-angular:/app  
      - /app/node_modules        
    command: npm start -- --host 0.0.0.0 --poll 2000 
    depends_on:
      - backend-spring
      - backend-fastapi

