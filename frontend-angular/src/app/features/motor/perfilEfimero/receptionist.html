<div class="min-h-screen max-w-7xl mx-auto p-8 bg-transparent">

  <header class="mb-10 text-center sm:text-left">
    <h1 class="text-3xl font-bold text-white tracking-tight">
      Panel de Recepción
    </h1>

    <p class="mt-2 text-lg text-slate-400">
      Seleccione un trámite para iniciar el flujo de gestión
    </p>
  </header>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">

    <div
      *ngFor="let policy of policies"
      (click)="openPolicyModal(policy)"
      class="group relative flex cursor-pointer flex-col overflow-hidden rounded-xl border border-cyan-950/70 bg-[#08111f] p-6 shadow-xl shadow-cyan-950/10 transition-all duration-300 hover:-translate-y-1 hover:border-cyan-400/50 hover:bg-[#0b1628] hover:shadow-cyan-500/10"
    >

      <div
        class="absolute inset-0 bg-gradient-to-br from-cyan-400/10 via-blue-500/5 to-transparent opacity-0 transition-opacity duration-300 group-hover:opacity-100">
      </div>

      <div
        class="relative z-10 mb-5 inline-flex h-14 w-14 items-center justify-center rounded-full border border-cyan-400/20 bg-cyan-400/10 text-cyan-400 transition-transform duration-300 group-hover:scale-110 group-hover:border-cyan-300/40 group-hover:bg-cyan-400/15"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="28"
          height="28"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-file-text"
        >
          <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
          <path d="M14 2v4a2 2 0 0 0 2 2h4" />
          <path d="M10 9H8" />
          <path d="M16 13H8" />
          <path d="M16 17H8" />
        </svg>
      </div>

      <h3 class="relative z-10 mb-2 text-lg font-bold text-white transition-colors duration-300 group-hover:text-cyan-300">
        {{ policy.name }}
      </h3>

      <p class="relative z-10 mb-6 line-clamp-3 flex-grow text-sm text-slate-400">
        {{ policy.description || 'Sin descripción disponible' }}
      </p>

      <button
        type="button"
        class="relative z-10 w-full rounded-lg border border-cyan-400/20 bg-cyan-400/10 py-2.5 font-semibold text-cyan-300 shadow-md shadow-cyan-950/20 transition-all duration-300 pointer-events-none group-hover:border-cyan-300/40 group-hover:bg-cyan-400 group-hover:text-slate-950 group-hover:shadow-cyan-500/20"
      >
        Iniciar Trámite
      </button>
    </div>

  </div>

  <app-dynamic-modal
    [isOpen]="isModalOpen"
    [config]="currentModalConfig"
    (close)="closeModal()"
    (submitForm)="handleFormSubmit($event)"
  >
  </app-dynamic-modal>

</div>
