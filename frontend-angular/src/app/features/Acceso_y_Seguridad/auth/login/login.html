<div class="min-h-screen flex items-center justify-center bg-[#05070a] p-4 relative overflow-hidden">
  <!-- Destello de fondo decorativo cian (opcional pero le da el toque premium) -->
  <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-cyan-500/5 blur-[120px] rounded-full pointer-events-none"></div>

  <!-- Contenedor Principal con efecto Glassmorphism sutil -->
  <div class="w-full max-w-[390px] bg-gradient-to-b from-[#0e131f] to-[#0a0d14] border border-slate-800/80 rounded-2xl p-8 shadow-[0_25px_50px_-12px_rgba(0,0,0,0.7)] backdrop-blur-md relative z-10">
    
    <!-- Header del Login -->
    <div class="flex flex-col space-y-2 mb-8 text-center">
      <h1 class="text-3xl font-bold tracking-tight text-white">
        Work<span class="text-cyan-400 drop-shadow-[0_0_15px_rgba(34,211,238,0.3)]">Flow</span>
      </h1>
      <p class="text-xs text-slate-400 font-medium tracking-wide uppercase">Ingresa tus credenciales</p>
    </div>

    <!-- Alerta de Error optimizada -->
    <div *ngIf="errorMessage"
      class="mb-6 p-3.5 bg-red-500/5 border border-red-500/20 rounded-xl flex items-center gap-3 animate-[shake_0.5s_ease-in-out]">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="text-red-400 shrink-0">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span class="text-sm text-red-400/90 font-medium">{{ errorMessage }}</span>
    </div>

    <!-- Formulario -->
    <form (submit)="signIn($event)" class="space-y-5">

      <div class="space-y-1.5">
        <app-ui-input 
          label="Usuario" 
          [(value)]="credentials.name" 
          placeholder="Juan"
          class="block w-full focus-within:text-cyan-400">
        </app-ui-input>
      </div>

      <div class="space-y-1.5">
        <app-ui-input 
          label="Contraseña" 
          type="password" 
          [(value)]="credentials.passwordHash" 
          placeholder="••••••••"
          class="block w-full focus-within:text-cyan-400">
        </app-ui-input>
      </div>

      <!-- Botón con Transición y Sombra Cian -->
      <div class="pt-2">
        <app-ui-button 
          type="submit" 
          [disabled]="isLoading"
          class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold py-3 px-4 rounded-xl transition-all duration-200 shadow-[0_4px_20px_rgba(6,182,212,0.15)] hover:shadow-[0_4px_25px_rgba(6,182,212,0.3)] disabled:opacity-50 disabled:pointer-events-none block text-center">
          {{ isLoading ? 'Accediendo...' : 'Acceder al Sistema' }}
        </app-ui-button>
      </div>

    </form>
  </div>
</div>

<style>
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-4px); }
    40%, 80% { transform: translateX(4px); }
  }
</style>
