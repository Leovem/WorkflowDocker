<div class="min-h-screen flex items-center justify-center bg-[#0a0a0a] p-4">
  <div class="w-full max-w-[380px] bg-[#0a0a0a] border border-slate-800 rounded-xl p-8 shadow-2xl">

    <div class="flex flex-col space-y-2 mb-8 text-center">
      <h1 class="text-2xl font-semibold text-white">Work<span class="text-emerald-500">Flow</span></h1>
      <p class="text-sm text-slate-400">Ingresa tus credenciales</p>
    </div>

    <div *ngIf="errorMessage"
      class="mb-6 p-3 bg-red-500/10 border border-red-500/20 rounded-lg flex items-center gap-3 animate-[shake_0.5s_ease-in-out]">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="text-red-400 shrink-0">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span class="text-sm text-red-400 font-medium">{{ errorMessage }}</span>
    </div>

    <form (submit)="signIn($event)" class="space-y-4">

      <app-ui-input label="Usuario" [(value)]="credentials.name" placeholder="Juan">
      </app-ui-input>

      <app-ui-input label="Contraseña" type="password" [(value)]="credentials.passwordHash" placeholder="••••••••">
      </app-ui-input>

      <app-ui-button type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Accediendo...' : 'Acceder al Sistema' }}
      </app-ui-button>

    </form>
  </div>
</div>

<style>
  @keyframes shake {

    0%,
    100% {
      transform: translateX(0);
    }

    20%,
    60% {
      transform: translateX(-4px);
    }

    40%,
    80% {
      transform: translateX(4px);
    }
  }
</style>
