@if (isOpen()) {
  <div class="fixed inset-0 bg-black/70 z-40 lg:hidden backdrop-blur-md" (click)="toggleMobile()"></div>
}

<button (click)="toggleMobile()"
  class="lg:hidden fixed top-4 left-4 z-50 p-2 bg.5 bg-[#0b0f19] border border-slate-800/80 rounded-xl text-cyan-400 shadow-[0_4px_20px_rgba(6,182,212,0.15)] hover:bg-cyan-500/10 transition-all">
  <span class="text-xs font-bold">{{ isCollapsed() ? '→' : '←' }}</span>
</button>

<nav [class]="'fixed lg:sticky top-0 left-0 z-40 bg-gradient-to-b from-[#0e131f] to-[#070a12] h-screen border-r border-slate-900 flex flex-col transform transition-all duration-300 shrink-0 shadow-2xl ' + 
             (isCollapsed() ? 'w-20' : 'w-64') + ' ' + 
             (isOpen() ? 'translate-x-0' : '-translate-x-full lg:translate-x-0')">

  <button (click)="toggleCollapse()"
    class="hidden lg:flex absolute -right-3 top-10 w-6 h-6 bg-cyan-500 rounded-full items-center justify-center text-slate-950 border border-cyan-300 z-50 hover:bg-cyan-400 transition-all shadow-[0_0_15px_rgba(34,211,238,0.4)] active:scale-90">
    <span class="text-[10px] font-black">{{ isCollapsed() ? '→' : '←' }}</span>
  </button>

  <div
    [class]="'pt-7 pb-5 px-4 flex flex-col items-center border-b border-slate-900 transition-all duration-300 ' + (isCollapsed() ? 'opacity-0 h-0 overflow-hidden mb-0' : 'opacity-100 mb-4')">
    <div
      class="w-14 h-14 bg-cyan-500/10 rounded-full flex items-center justify-center border border-cyan-500/30 mb-3 shadow-[0_0_20px_rgba(6,182,212,0.15)]">
      <span class="text-cyan-400 text-xl font-black">{{ userName ? userName.charAt(0).toUpperCase() : 'P' }}</span>
    </div>
    <div class="text-center w-full">
      <h3 class="text-white font-bold text-xs tracking-wide truncate px-2">{{ userName }}</h3>
      <span
        class="text-[9px] bg-cyan-500/10 text-cyan-400 px-2.5 py-0.5 rounded-full font-bold uppercase tracking-widest border border-cyan-500/20 mt-1.5 inline-block">
        {{ role }}
      </span>
    </div>
  </div>

  <div class="flex-1 overflow-y-auto overflow-x-hidden pt-2"
    style="direction: rtl; scrollbar-width: thin; scrollbar-color: #06b6d4 #070a12;">
    <div style="direction: ltr" class="px-3">

      @for (group of visibleMenuGroups; track group.title) {

        @if (!isCollapsed()) {
          <p [class]="group.title === 'Menú' ? 
                'text-[9px] font-black text-slate-500 uppercase tracking-[0.2em] mb-2 mt-3 opacity-60 px-4 font-sans' : 
                'text-[9px] font-black text-cyan-400 uppercase tracking-[0.2em] mt-6 mb-2 opacity-80 px-4 font-sans'">
            {{ group.title }}
          </p>
        }

        @for (item of group.items; track item.label) {
          <a [routerLink]="item.path" 
             routerLinkActive="bg-cyan-500/10 text-cyan-400 border-cyan-500/20 font-semibold shadow-[inset_0_0_12px_rgba(6,182,212,0.05)]"
             class="flex items-center px-4 py-3 my-1 text-slate-400 transition-all rounded-xl border border-transparent hover:bg-cyan-500/5 hover:text-cyan-400 group">

            <lucide-icon [name]="item.icon" [size]="18" [class]="isCollapsed() ? 'mx-auto' : 'mr-3'"></lucide-icon>

            @if (!isCollapsed()) {
              <span class="text-sm tracking-wide">{{ item.label }}</span>
            }
          </a>
        }
      }
    </div>
  </div>

  <div class="p-4 border-t border-slate-900 bg-[#070a12]/50 backdrop-blur-sm">
    <button (click)="logout()"
      class="w-full flex items-center justify-center py-3 text-red-400 hover:bg-red-500/10 rounded-xl transition-all text-xs font-bold uppercase border border-red-500/10 hover:border-red-500/20 group">

      <lucide-icon [name]="LogoutIcon" [size]="16" [class]="isCollapsed() ? '' : 'mr-2'"
        class="transition-transform group-hover:translate-x-0.5">
      </lucide-icon>

      @if (!isCollapsed()) {
        <span class="tracking-wider">Salir del Sistema</span>
      }
    </button>
  </div>

</nav>
