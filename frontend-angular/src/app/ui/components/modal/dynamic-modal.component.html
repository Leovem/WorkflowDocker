<div class="fixed inset-0 bg-black/80 backdrop-blur-sm flex justify-center items-center z-50 p-4" *ngIf="isOpen">
  <div class="bg-gradient-to-b from-[#0e131f] to-[#070a12] border border-slate-800/80 rounded-2xl w-full max-w-lg shadow-[0_25px_50px_-12px_rgba(0,0,0,0.8)] flex flex-col overflow-hidden">

    <div class="px-6 py-4 border-b border-slate-900 flex justify-between items-center bg-[#0e131f]/60 shrink-0">
      <div>
        <h2 class="text-xl font-bold text-white tracking-tight">{{ config.title }}</h2>
        <p *ngIf="config.description" class="text-xs text-slate-400 mt-1 italic font-medium">{{ config.description }}</p>
      </div>
      <button class="text-slate-500 hover:text-cyan-400 text-2xl leading-none font-bold transition-colors"
        (click)="onClose()">&times;</button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col overflow-hidden">
      
      <div class="p-6 max-h-[60vh] overflow-y-auto 
                  [&::-webkit-scrollbar]:w-1.5
                  [&::-webkit-scrollbar-track]:bg-[#070a12]
                  [&::-webkit-scrollbar-thumb]:bg-slate-800
                  [&::-webkit-scrollbar-thumb]:rounded-full
                  hover:[&::-webkit-scrollbar-thumb]:bg-cyan-500/30">

        <ng-container *ngIf="config.showProfileFields">
          <div class="flex items-center gap-2 mb-5">
            <div class="w-1.5 h-5 bg-cyan-500 rounded-full shadow-[0_0_10px_rgba(6,182,212,0.4)]"></div>
            <h3 class="text-base font-bold text-white tracking-wide">Datos del Solicitante</h3>
          </div>

          <div class="mb-4 flex flex-col">
            <label class="mb-1.5 font-semibold text-xs uppercase tracking-wider text-slate-400 ml-1">Nombre Completo</label>
            <input type="text" formControlName="fullName" placeholder="Ej. Juan Pérez"
              class="px-4 py-2.5 bg-[#0d121f]/60 border border-slate-800 rounded-xl text-white text-sm placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500/50 transition-all duration-200">
          </div>

          <div class="mb-4 flex flex-col">
            <label class="mb-1.5 font-semibold text-xs uppercase tracking-wider text-slate-400 ml-1">Correo Electrónico</label>
            <input type="email" formControlName="email" placeholder="ejemplo@correo.com"
              class="px-4 py-2.5 bg-[#0d121f]/60 border border-slate-800 rounded-xl text-white text-sm placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500/50 transition-all duration-200">
          </div>

          <div class="mb-4 flex flex-col">
            <label class="mb-1.5 font-semibold text-xs uppercase tracking-wider text-slate-400 ml-1">Carnet de Identidad (CI)</label>
            <input type="text" formControlName="documentId" placeholder="Ej. 1234567"
              class="px-4 py-2.5 bg-[#0d121f]/60 border border-slate-800 rounded-xl text-white text-sm placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500/50 transition-all duration-200">
          </div>

          <hr class="my-6 border-t border-slate-900">
        </ng-container>

        <ng-container *ngIf="config.customFields.length > 0">
          <div class="flex items-center gap-2 mb-5">
            <div class="w-1.5 h-5 bg-cyan-500 rounded-full shadow-[0_0_10px_rgba(6,182,212,0.4)]"></div>
            <h3 class="text-base font-bold text-white tracking-wide">Formulario de Actividad</h3>
          </div>

          <div class="mb-4 flex flex-col" *ngFor="let field of config.customFields">
            <label class="mb-1.5 font-semibold text-xs uppercase tracking-wider text-slate-400 ml-1">
              {{ field.label }} <span *ngIf="field.required" class="text-cyan-400">*</span>
            </label>

            <input *ngIf="field.type !== 'select'" [type]="field.type" [formControlName]="field.name"
              class="px-4 py-2.5 bg-[#0d121f]/60 border border-slate-800 rounded-xl text-white text-sm placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500/50 transition-all duration-200">

            <div *ngIf="field.type === 'select'" class="relative">
              <select [formControlName]="field.name"
                class="w-full px-4 py-2.5 bg-[#0d121f]/60 border border-slate-800 rounded-xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500/50 transition-all duration-200 appearance-none cursor-pointer">
                <option value="" disabled selected>Seleccione una opción...</option>
                <option *ngFor="let opt of field.options" [value]="opt">{{ opt }}</option>
              </select>
              <div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none text-slate-400">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </div>
            </div>
          </div>
        </ng-container>

        <ng-container *ngIf="config.mediaRequirements && (config.mediaRequirements.photo || config.mediaRequirements.document || config.mediaRequirements.audio || config.mediaRequirements.video)">
          
          <div class="flex items-center gap-2 mb-4 mt-6">
            <div class="w-1.5 h-5 bg-cyan-500 rounded-full shadow-[0_0_10px_rgba(6,182,212,0.4)]"></div>
            <h3 class="text-base font-bold text-white tracking-wide">Requisitos del Trámite</h3>
          </div>

          <div class="mb-4 flex flex-col" *ngIf="config.mediaRequirements.photo">
            <label class="mb-1.5 font-semibold text-xs uppercase tracking-wider text-slate-400 ml-1">
              {{ config.mediaLabels?.photo || 'Fotografía Requerida' }} <span class="text-cyan-400">*</span>
            </label>
            <input type="file" accept="image/*" (change)="onFileChange($event, 'file_photo')"
              class="block w-full text-xs text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-cyan-500/10 file:text-cyan-400 hover:file:bg-cyan-500/20 cursor-pointer border border-slate-800 rounded-xl bg-[#0d121f]/40 transition-colors">
          </div>

          <div class="mb-4 flex flex-col" *ngIf="config.mediaRequirements.document">
            <label class="mb-1.5 font-semibold text-xs uppercase tracking-wider text-slate-400 ml-1">
              {{ config.mediaLabels?.document || 'Documento PDF/Word' }} <span class="text-cyan-400">*</span>
            </label>
            <input type="file" accept=".pdf,.doc,.docx" (change)="onFileChange($event, 'file_document')"
              class="block w-full text-xs text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-cyan-500/10 file:text-cyan-400 hover:file:bg-cyan-500/20 cursor-pointer border border-slate-800 rounded-xl bg-[#0d121f]/40 transition-colors">
          </div>

          <div class="mb-4 flex flex-col" *ngIf="config.mediaRequirements.audio">
            <label class="mb-1.5 font-semibold text-xs uppercase tracking-wider text-slate-400 ml-1">
              {{ config.mediaLabels?.audio || 'Grabación de Audio' }} <span class="text-cyan-400">*</span>
            </label>
            <input type="file" accept="audio/*" (change)="onFileChange($event, 'file_audio')"
              class="block w-full text-xs text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-cyan-500/10 file:text-cyan-400 hover:file:bg-cyan-500/20 cursor-pointer border border-slate-800 rounded-xl bg-[#0d121f]/40 transition-colors">
          </div>

          <div class="mb-4 flex flex-col" *ngIf="config.mediaRequirements.video">
            <label class="mb-1.5 font-semibold text-xs uppercase tracking-wider text-slate-400 ml-1">
              {{ config.mediaLabels?.video || 'Grabación de Video' }} <span class="text-cyan-400">*</span>
            </label>
            <input type="file" accept="video/*" (change)="onFileChange($event, 'file_video')"
              class="block w-full text-xs text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-cyan-500/10 file:text-cyan-400 hover:file:bg-cyan-500/20 cursor-pointer border border-slate-800 rounded-xl bg-[#0d121f]/40 transition-colors">
          </div>
        </ng-container>

      </div>

      <div class="px-6 py-4 border-t border-slate-900 flex justify-end gap-3 bg-[#070a12]/60 shrink-0">
        <button type="button" (click)="onClose()"
          class="px-5 py-2.5 border border-slate-800 bg-transparent text-slate-400 rounded-xl hover:bg-slate-800/60 hover:text-white transition-colors text-xs font-bold uppercase tracking-wide">
          Cancelar
        </button>
        <button type="submit" [disabled]="form.invalid"
          class="px-5 py-2.5 bg-cyan-500 text-slate-950 rounded-xl hover:bg-cyan-400 disabled:bg-slate-900 disabled:text-slate-600 disabled:cursor-not-allowed disabled:shadow-none disabled:pointer-events-none transition-all text-xs font-bold uppercase tracking-wide shadow-[0_4px_15px_rgba(6,182,212,0.25)]">
          Iniciar Trámite
        </button>
      </div>
    </form>

  </div>
</div>
