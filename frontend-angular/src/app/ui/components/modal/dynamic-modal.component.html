<div class="fixed inset-0 bg-black/80 backdrop-blur-sm flex justify-center items-center z-50" *ngIf="isOpen">
    <div
        class="bg-[#141414] border border-slate-800 rounded-xl w-full max-w-lg shadow-2xl flex flex-col mx-4 overflow-hidden">

        <div class="px-6 py-4 border-b border-slate-800 flex justify-between items-center bg-[#1a1a1a]">
            <div>
                <h2 class="text-xl font-bold text-white tracking-tight">{{ config.title }}</h2>
                <p *ngIf="config.description" class="text-xs text-slate-500 mt-1 italic">{{ config.description }}</p>
            </div>
            <button class="text-slate-500 hover:text-emerald-400 text-2xl leading-none font-bold transition-colors"
                (click)="onClose()">&times;</button>
        </div>

        <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <div class="p-6 max-h-[60vh] overflow-y-auto 
                        [&::-webkit-scrollbar]:w-2
                        [&::-webkit-scrollbar-track]:bg-[#0a0a0a]
                        [&::-webkit-scrollbar-track]:rounded-full
                        [&::-webkit-scrollbar-thumb]:bg-slate-700
                        [&::-webkit-scrollbar-thumb]:rounded-full
                        hover:[&::-webkit-scrollbar-thumb]:bg-emerald-500/50">

                <ng-container *ngIf="config.showProfileFields">
                    <div class="flex items-center gap-2 mb-4">
                        <div class="w-1.5 h-5 bg-emerald-500 rounded-full"></div>
                        <h3 class="text-lg font-bold text-white">Datos del Solicitante</h3>
                    </div>

                    <div class="mb-4 flex flex-col">
                        <label class="mb-1.5 font-medium text-sm text-slate-400">Nombre Completo</label>
                        <input type="text" formControlName="fullName" placeholder="Ej. Juan Pérez"
                            class="px-4 py-2.5 bg-[#0a0a0a] border border-slate-800 rounded-lg text-white placeholder-slate-600 focus:outline-none focus:ring-1 focus:ring-emerald-500 focus:border-emerald-500 transition-all">
                    </div>

                    <div class="mb-4 flex flex-col">
                        <label class="mb-1.5 font-medium text-sm text-slate-400">Correo Electrónico</label>
                        <input type="email" formControlName="email" placeholder="ejemplo@correo.com"
                            class="px-4 py-2.5 bg-[#0a0a0a] border border-slate-800 rounded-lg text-white placeholder-slate-600 focus:outline-none focus:ring-1 focus:ring-emerald-500 focus:border-emerald-500 transition-all">
                    </div>

                    <div class="mb-4 flex flex-col">
                        <label class="mb-1.5 font-medium text-sm text-slate-400">Carnet de Identidad (CI)</label>
                        <input type="text" formControlName="documentId" placeholder="Ej. 1234567"
                            class="px-4 py-2.5 bg-[#0a0a0a] border border-slate-800 rounded-lg text-white placeholder-slate-600 focus:outline-none focus:ring-1 focus:ring-emerald-500 focus:border-emerald-500 transition-all">
                    </div>

                    <hr class="my-6 border-t border-slate-800">
                </ng-container>

                <ng-container *ngIf="config.customFields.length > 0">
                    <div class="flex items-center gap-2 mb-4">
                        <div class="w-1.5 h-5 bg-emerald-500 rounded-full"></div>
                        <h3 class="text-lg font-bold text-white">Formulario de Actividad</h3>
                    </div>

                    <div class="mb-4 flex flex-col" *ngFor="let field of config.customFields">
                        <label class="mb-1.5 font-medium text-sm text-slate-400">
                            {{ field.label }} <span *ngIf="field.required" class="text-emerald-500">*</span>
                        </label>

                        <input *ngIf="field.type !== 'select'" [type]="field.type" [formControlName]="field.name"
                            class="px-4 py-2.5 bg-[#0a0a0a] border border-slate-800 rounded-lg text-white placeholder-slate-600 focus:outline-none focus:ring-1 focus:ring-emerald-500 focus:border-emerald-500 transition-all">

                        <div *ngIf="field.type === 'select'" class="relative">
                            <select [formControlName]="field.name"
                                class="w-full px-4 py-2.5 bg-[#0a0a0a] border border-slate-800 rounded-lg text-white focus:outline-none focus:ring-1 focus:ring-emerald-500 focus:border-emerald-500 transition-all appearance-none cursor-pointer">
                                <option value="" disabled selected>Seleccione una opción...</option>
                                <option *ngFor="let opt of field.options" [value]="opt">{{ opt }}</option>
                            </select>
                            <div
                                class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none text-slate-400">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <polyline points="6 9 12 15 18 9"></polyline>
                                </svg>
                            </div>
                        </div>
                    </div>
                </ng-container>

                <ng-container
                    *ngIf="config.mediaRequirements && (config.mediaRequirements.photo || config.mediaRequirements.document || config.mediaRequirements.audio || config.mediaRequirements.video)">

                    <div class="flex items-center gap-2 mb-4 mt-6">
                        <div class="w-1.5 h-5 bg-emerald-500 rounded-full"></div>
                        <h3 class="text-lg font-bold text-white">Requisitos del Trámite</h3>
                    </div>

                    <div class="mb-4 flex flex-col" *ngIf="config.mediaRequirements.photo">
                        <label class="mb-1.5 font-medium text-sm text-slate-400">
                            {{ config.mediaLabels?.photo || 'Fotografía Requerida' }}
                            <span class="text-emerald-500">*</span>
                        </label>
                        <input type="file" accept="image/*" formControlName="file_photo"
                            (change)="onFileChange($event, 'file_photo')"
                            class="block w-full text-sm text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-emerald-500/10 file:text-emerald-500 hover:file:bg-emerald-500/20 cursor-pointer border border-slate-800 rounded-lg bg-[#0a0a0a]">
                    </div>

                    <div class="mb-4 flex flex-col" *ngIf="config.mediaRequirements.document">
                        <label class="mb-1.5 font-medium text-sm text-slate-400">
                            {{ config.mediaLabels?.document || 'Documento PDF/Word' }}
                            <span class="text-emerald-500">*</span>
                        </label>
                        <input type="file" accept=".pdf,.doc,.docx" formControlName="file_document"
                            (change)="onFileChange($event, 'file_document')"
                            class="block w-full text-sm text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-emerald-500/10 file:text-emerald-500 hover:file:bg-emerald-500/20 cursor-pointer border border-slate-800 rounded-lg bg-[#0a0a0a]">
                    </div>

                    <div class="mb-4 flex flex-col" *ngIf="config.mediaRequirements.audio">
                        <label class="mb-1.5 font-medium text-sm text-slate-400">
                            {{ config.mediaLabels?.audio || 'Grabación de Audio' }}
                            <span class="text-emerald-500">*</span>
                        </label>
                        <input type="file" accept="audio/*" formControlName="file_audio"
                            (change)="onFileChange($event, 'file_audio')"
                            class="block w-full text-sm text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-emerald-500/10 file:text-emerald-500 hover:file:bg-emerald-500/20 cursor-pointer border border-slate-800 rounded-lg bg-[#0a0a0a]">
                    </div>

                    <div class="mb-4 flex flex-col" *ngIf="config.mediaRequirements.video">
                        <label class="mb-1.5 font-medium text-sm text-slate-400">
                            {{ config.mediaLabels?.video || 'Grabación de Video' }}
                            <span class="text-emerald-500">*</span>
                        </label>
                        <input type="file" accept="video/*" formControlName="file_video"
                            (change)="onFileChange($event, 'file_video')"
                            class="block w-full text-sm text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-emerald-500/10 file:text-emerald-500 hover:file:bg-emerald-500/20 cursor-pointer border border-slate-800 rounded-lg bg-[#0a0a0a]">
                    </div>

                </ng-container>

            </div>

            <div class="px-6 py-4 border-t border-slate-800 flex justify-end gap-3 bg-[#1a1a1a]">
                <button type="button" (click)="onClose()"
                    class="px-5 py-2 border border-slate-700 bg-transparent text-slate-300 rounded-lg hover:bg-slate-800 hover:text-white transition-colors font-medium">
                    Cancelar
                </button>
                <button type="submit" [disabled]="form.invalid"
                    class="px-5 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-500 disabled:bg-slate-800 disabled:text-slate-500 disabled:cursor-not-allowed transition-all font-medium shadow-lg shadow-emerald-900/20">
                    Iniciar Trámite
                </button>
            </div>
        </form>

    </div>
</div>
