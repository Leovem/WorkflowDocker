<div class="fixed bottom-6 right-6 w-96 h-[550px] max-h-[85vh] bg-gradient-to-b from-[#0e131f] to-[#070a12] border border-cyan-500/30 rounded-2xl flex flex-col z-[100] shadow-[0_15px_50px_rgba(6,182,212,0.15)] backdrop-blur-md overflow-hidden">
  
  <div class="h-14 flex items-center justify-between px-5 border-b border-slate-900 shrink-0 bg-[#070a12]/60">
    <h2 class="font-bold text-white uppercase text-[11px] tracking-widest flex items-center gap-2">
      <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse block" style="box-shadow: 0 0 12px #22d3ee;"></span>
      ChatBot IA
    </h2>
    <button (click)="cerrar()" class="text-slate-500 hover:text-red-400 transition-colors">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"></path></svg>
    </button>
  </div>

  <div class="flex-1 overflow-y-auto p-5 space-y-5 text-xs 
              [&::-webkit-scrollbar]:w-1.5 [&::-webkit-scrollbar-thumb]:bg-cyan-950 [&::-webkit-scrollbar-thumb]:rounded-full hover:[&::-webkit-scrollbar-thumb]:bg-cyan-500/40">
    
    <div *ngFor="let msg of chatMessages" 
         class="flex flex-col"
         [class.items-end]="msg.role === 'user'" 
         [class.items-start]="msg.role === 'assistant'">
      
      <span class="text-[9px] uppercase tracking-wider text-slate-500 mb-1 ml-1" *ngIf="msg.role === 'assistant'">Jarvis</span>
      <span class="text-[9px] uppercase tracking-wider text-cyan-400 mb-1 mr-1" *ngIf="msg.role === 'user'">Tú</span>

      <div class="inline-block p-3.5 rounded-2xl max-w-[85%] text-left relative text-sm tracking-wide"
           [class.bg-gradient-to-br]="msg.role === 'user'" [class.from-cyan-600]="msg.role === 'user'" [class.to-cyan-700]="msg.role === 'user'" [class.text-slate-950]="msg.role === 'user'" [class.font-medium]="msg.role === 'user'" [class.rounded-tr-sm]="msg.role === 'user'"
           [class.bg-[#0d121f]/90]="msg.role === 'assistant'" [class.text-slate-200]="msg.role === 'assistant'" [class.rounded-tl-sm]="msg.role === 'assistant'"
           [class.border]="msg.role === 'assistant'" [class.border-slate-800/80]="msg.role === 'assistant'">
        
        <p class="whitespace-pre-wrap leading-relaxed">{{ msg.content }}</p>
        
        <button *ngIf="msg.hasAction && !msg.actionPayload?.tour" (click)="aplicarCambios(msg.actionPayload)"
                class="mt-3 w-full bg-cyan-400 text-slate-950 py-2.5 rounded-xl text-[10px] uppercase font-bold tracking-wider hover:bg-cyan-300 transition-all shadow-[0_4px_15px_rgba(6,182,212,0.2)]">
          Aplicar al Diagrama
        </button>
      </div>
    </div>
    
    <div *ngIf="isAiTyping" class="flex gap-1.5 items-center p-3">
      <div class="w-1.5 h-1.5 bg-cyan-400 rounded-full animate-bounce"></div>
      <div class="w-1.5 h-1.5 bg-cyan-400 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
      <div class="w-1.5 h-1.5 bg-cyan-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
    </div>
  </div>

  <div class="p-4 border-t border-slate-900 bg-[#070a12]/80 backdrop-blur-sm">
    <div class="flex gap-2 items-end">
      
      <button (click)="toggleRecording()" 
              [class.bg-red-500/20]="isRecording" [class.text-red-400]="isRecording" [class.border-red-500/40]="isRecording"
              [class.bg-[#0d121f]]="!isRecording" [class.text-slate-400]="!isRecording" [class.border-slate-800]="!isRecording"
              class="shrink-0 w-11 h-11 rounded-xl flex items-center justify-center border transition-all hover:bg-slate-800/60">
        
        <svg *ngIf="!isRecording" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="22"></line>
        </svg>

        <span *ngIf="isRecording" class="flex gap-0.5 items-center justify-center h-full">
          <span class="w-1 bg-red-400 h-3 rounded-full animate-pulse"></span>
          <span class="w-1 bg-red-400 h-5 rounded-full animate-pulse" style="animation-delay: 0.1s"></span>
          <span class="w-1 bg-red-400 h-3 rounded-full animate-pulse" style="animation-delay: 0.2s"></span>
        </span>
      </button>

      <textarea [(ngModel)]="userPrompt" (keyup.enter)="enviarMensaje()"
                placeholder="Pregúntale a Jarvis..." 
                rows="1"
                class="flex-1 bg-[#0d121f] border border-slate-800 rounded-xl px-4 py-3 text-xs text-white outline-none focus:border-cyan-500/50 resize-none min-h-[44px] transition-colors placeholder:text-slate-600"></textarea>
      
      <button (click)="enviarMensaje()" [disabled]="!userPrompt.trim() || isAiTyping"
              class="shrink-0 bg-cyan-500 hover:bg-cyan-400 disabled:opacity-40 disabled:pointer-events-none text-slate-950 w-11 h-11 rounded-xl flex items-center justify-center transition-all shadow-[0_4px_15px_rgba(6,182,212,0.2)]">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"></path></svg>
      </button>
    </div>

    <div class="flex gap-2 mt-3 overflow-x-auto [&::-webkit-scrollbar]:hidden">
      <button (click)="preguntarRapido('Audita este diagrama buscando nodos sueltos o errores.')" 
              class="shrink-0 text-[10px] font-bold tracking-wider uppercase bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-400 border border-cyan-500/20 px-3 py-2 rounded-xl transition-colors">
        ✨ Auditar Diagrama
      </button>
    </div>
  </div>
</div>
