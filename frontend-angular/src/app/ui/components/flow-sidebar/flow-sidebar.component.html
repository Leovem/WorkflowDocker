<aside
  [class]="'relative transition-all duration-500 ease-in-out bg-gradient-to-b from-[#0e131f] to-[#070a12] flex flex-col h-full shrink-0 shadow-2xl ' + (isOpen ? 'w-80 border-l border-slate-900' : 'w-0 border-l-0')">

  <button (click)="toggleSidebar()"
    class="absolute -left-6 top-1/2 -translate-y-1/2 z-[70] w-6 h-12 bg-[#0e131f] border border-slate-800/80 flex items-center justify-center rounded-l-xl text-cyan-400 shadow-[0_4px_20px_rgba(0,0,0,0.5)] hover:text-cyan-300 active:scale-95 transition-all">
    <span class="text-xs font-black">{{ isOpen ? '›' : '‹' }}</span>
  </button>

  <div class="w-full h-full overflow-hidden">
    <div
      [class]="'w-80 h-full overflow-y-auto overflow-x-hidden transition-opacity duration-300 ' + (!isOpen ? 'opacity-0 pointer-events-none' : 'opacity-100')"
      style="scroll-behavior: smooth; scrollbar-width: thin; scrollbar-color: #06b6d4 #070a12;">

      <div class="p-6 space-y-5 pb-32">
        <h2 class="text-[9px] font-black text-slate-500 uppercase tracking-[0.3em] mb-6 font-sans text-center opacity-80">
          Library UML 2.5
        </h2>

        <details class="group border-b border-slate-900 pb-4" open>
          <summary class="list-none flex justify-between items-center cursor-pointer text-[10px] font-black text-cyan-400 uppercase tracking-wider select-none">
            <span class="flex items-center gap-2">🏢 Unidades Responsables</span>
            <span class="group-open:rotate-180 transition-transform text-[8px] text-slate-500">▼</span>
          </summary>

          <div class="space-y-2 mt-4">
            @for (d of deptos; track d.id) {
              <div draggable="true"
                (dragstart)="onDragStart($event, 'lane', d.name, { isLane: true, departmentId: d.id })"
                class="p-3 bg-[#0d121f]/50 border border-slate-800/60 rounded-xl cursor-grab hover:border-cyan-500/50 hover:bg-cyan-500/5 transition-all text-[10px] text-slate-300 font-bold uppercase tracking-wide shadow-sm active:cursor-grabbing">
                {{ d.name }}
              </div>
            }
          </div>
        </details>

        <details class="group border-b border-slate-900 pb-4" open>
          <summary class="list-none flex justify-between items-center cursor-pointer text-[10px] font-black text-slate-400 uppercase tracking-wider select-none group-hover:text-slate-300">
            <span class="flex items-center gap-2">⚖️ Control y Actividades</span>
            <span class="group-open:rotate-180 transition-transform text-[8px] text-slate-500">▼</span>
          </summary>

          <div class="grid grid-cols-1 gap-2.5 mt-4">

            <div draggable="true"
              (dragstart)="onDragStart($event, 'decision', 'Condición', { departmentId: (deptos[0]?.id || 'default') })"
              class="p-3 bg-[#0d121f]/50 border border-slate-800/60 rounded-xl cursor-grab flex items-center gap-3 hover:border-cyan-500/40 transition-all active:cursor-grabbing">
              <div class="w-3 h-3 border-2 border-cyan-400 rotate-45 shadow-[0_0_8px_rgba(6,182,212,0.4)]"></div>
              <span class="text-[10px] text-slate-300 font-bold uppercase tracking-wide">If / Else</span>
            </div>

            <div draggable="true"
              (dragstart)="onDragStart($event, 'action', 'Tarea Nueva', { departmentId: (deptos[0]?.id || 'default') })"
              class="p-3 bg-[#0d121f]/80 border border-cyan-500/30 rounded-xl cursor-grab text-center text-[10px] text-cyan-400 font-black uppercase tracking-widest hover:bg-cyan-500/10 hover:border-cyan-500/50 transition-all active:scale-95 active:cursor-grabbing shadow-sm">
              Actividad
            </div>

            <div draggable="true"
              (dragstart)="onDragStart($event, 'merge', 'Merge', { departmentId: (deptos[0]?.id || 'default') })"
              class="p-3 bg-[#0d121f]/50 border border-slate-800/60 rounded-xl cursor-grab flex items-center gap-3 hover:border-slate-700 transition-all active:cursor-grabbing">
              <div class="w-3 h-3 border border-slate-400 rotate-45"></div>
              <span class="text-[10px] text-slate-400 font-bold uppercase tracking-wide">Merge (Fusión)</span>
            </div>
          </div>
        </details>

        <details class="group border-b border-slate-900 pb-4" open>
          <summary class="list-none flex justify-between items-center cursor-pointer text-[10px] font-black text-slate-400 uppercase tracking-wider select-none">
            <span class="flex items-center gap-2">🚩 Estados y Tiempos</span>
            <span class="group-open:rotate-180 transition-transform text-[8px] text-slate-500">▼</span>
          </summary>

          <div class="space-y-3 mt-4">

            <div class="grid grid-cols-2 gap-2.5">
              <div draggable="true"
                (dragstart)="onDragStart($event, 'start', 'Inicio', { departmentId: (deptos[0]?.id || 'default') })"
                class="p-3 bg-[#0d121f]/50 border border-slate-800/60 rounded-xl cursor-grab flex flex-col items-center gap-1.5 hover:border-cyan-500/40 transition-all active:cursor-grabbing">
                <div class="w-3 h-3 bg-cyan-400 rounded-full shadow-[0_0_10px_#22d3ee]"></div>
                <span class="text-[8px] text-slate-400 font-black uppercase tracking-wider">Inicio</span>
              </div>

              <div draggable="true"
                (dragstart)="onDragStart($event, 'end', 'Fin', { departmentId: (deptos[0]?.id || 'default') })"
                class="p-3 bg-[#0d121f]/50 border border-slate-800/60 rounded-xl cursor-grab flex flex-col items-center gap-1.5 hover:border-red-500/40 transition-all active:cursor-grabbing">
                <div class="w-3 h-3 bg-red-500 rounded-full border border-[#0e131f] ring-2 ring-red-500/30"></div>
                <span class="text-[8px] text-slate-400 font-black uppercase tracking-wider">Fin</span>
              </div>
            </div>

            <div draggable="true"
              (dragstart)="onDragStart($event, 'fork', 'Fork (División)', { departmentId: (deptos[0]?.id || 'default') })"
              class="p-4 bg-[#0d121f]/40 border border-cyan-500/10 rounded-xl cursor-grab flex flex-col items-center gap-3 hover:border-cyan-500/40 transition-all group active:cursor-grabbing">
              <div class="w-24 h-1.5 bg-cyan-500 rounded-full shadow-[0_0_10px_rgba(6,182,212,0.4)] group-hover:bg-cyan-400 transition-all"></div>
              <span class="text-[8px] text-slate-400 font-black uppercase tracking-wider text-center select-none">
                Fork / División
              </span>
            </div>

            <div draggable="true"
              (dragstart)="onDragStart($event, 'join', 'Join (Unión)', { departmentId: (deptos[0]?.id || 'default') })"
              class="p-4 bg-[#0d121f]/40 border border-amber-500/10 rounded-xl cursor-grab flex flex-col items-center gap-3 hover:border-amber-500/40 transition-all group active:cursor-grabbing">
              <div class="w-24 h-1.5 bg-amber-500 rounded-full shadow-[0_0_10px_rgba(245,158,11,0.4)] group-hover:bg-amber-400 transition-all"></div>
              <span class="text-[8px] text-slate-400 font-black uppercase tracking-wider text-center select-none">
                Join / Sincronización
              </span>
            </div>

          </div>
        </details>
      </div>
    </div>
  </div>
</aside>
