# ===============================
# CONFIGURACIÓN GENERAL
# ===============================
server.port=${SERVER_PORT:8080}

# ===============================
# MONGODB
# ===============================

# Si tu proyecto usa una configuración/factory propio que lee spring.mongodb.uri,
# dejamos también esta propiedad apuntando a la misma variable.
spring.mongodb.uri=${SPRING_DATA_MONGODB_URI}

logging.level.org.springframework.data.mongodb=${SPRING_MONGODB_LOG_LEVEL:INFO}

# ===============================
# CORREO
# ===============================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_STARTTLS_REQUIRED:true}

# ===============================
# LÍMITE DE SUBIDA DE ARCHIVOS
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:50MB}

# ===============================
# AWS S3
# ===============================
aws.s3.bucket=${AWS_S3_BUCKET}
aws.s3.region=${AWS_REGION}

# Para pruebas locales o Docker con access keys.
# En EC2 después podemos usar IAM Role y dejar estos valores vacíos.
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}